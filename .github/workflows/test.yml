name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    # windows-latest: the guards in hooks/** are Windows/Git-Bash-specific
    # by design (MSYS path rewriting, PowerShell-vs-bash detection, Windows
    # drive-letter normalization) -- this is where they actually run.
    runs-on: windows-latest
    strategy:
      matrix:
        node-version: [lts/*]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - run: npm install --no-audit --no-fund
      - run: npm test
